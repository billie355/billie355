<svg width="860" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#7c3aed;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#7c3aed;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0f0c29;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="860" height="60" fill="#0d1117" rx="0"/>
  <!-- Animated glow line -->
  <rect x="0" y="29" width="860" height="2" fill="url(#divGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Moving shimmer -->
  <rect x="-200" y="27" width="200" height="6" rx="3" fill="white" opacity="0.15">
    <animate attributeName="x" values="-200;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
