<svg width="860" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#24243e">
        <animate attributeName="stop-color" values="#24243e;#1a0533;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#302b63">
        <animate attributeName="stop-color" values="#302b63;#4a2080;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#24243e;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="860" height="120" fill="url(#footerBg)" rx="0"/>
  <!-- Glow orb -->
  <ellipse cx="430" cy="60" rx="300" ry="80" fill="url(#centerGlow)">
    <animate attributeName="ry" values="80;100;80" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Stars -->
  <g fill="white">
    <circle cx="80" cy="30" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="15" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="20" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="35" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="100" r="1.5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Top wave -->
  <path d="M0 0 Q215 20 430 0 Q645 -20 860 0 L860 0 L0 0 Z" fill="#a78bfa" opacity="0.1">
    <animate attributeName="d"
      values="M0 0 Q215 20 430 0 Q645 -20 860 0 L860 0 L0 0 Z;
              M0 0 Q215 15 430 5 Q645 -10 860 0 L860 0 L0 0 Z;
              M0 0 Q215 20 430 0 Q645 -20 860 0 L860 0 L0 0 Z"
      dur="5s" repeatCount="indefinite"/>
  </path>
  <!-- Footer text -->
  <text x="430" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600"
        fill="#a78bfa" text-anchor="middle" filter="url(#glow)">
    Thanks for visiting! Let's build something amazing together 🚀
  </text>
  <text x="430" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="300"
        fill="#6d6a9c" text-anchor="middle">
    © 2025 Billy Joe · Front-End Developer · Philippines 🇵🇭
  </text>
</svg>
