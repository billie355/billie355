<svg width="860" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a0533;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#302b63">
        <animate attributeName="stop-color" values="#302b63;#4a2080;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#24243e">
        <animate attributeName="stop-color" values="#24243e;#0f0c29;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for text -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orb gradient -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="220" fill="url(#bgGrad)" rx="16"/>

  <!-- Animated orbs -->
  <ellipse cx="100" cy="110" rx="120" ry="120" fill="url(#orb1)">
    <animate attributeName="cx" values="100;160;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;80;110" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="110" rx="140" ry="140" fill="url(#orb2)">
    <animate attributeName="cx" values="760;700;760" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;150;110" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="430" cy="40" rx="100" ry="100" fill="url(#orb3)">
    <animate attributeName="cy" values="40;80;40" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Stars / particles -->
  <g fill="#ffffff">
    <!-- Star group 1 -->
    <circle cx="50" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="60" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="20" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="45" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="15" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="200" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="55" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="20" r="1.5"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="40" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="15" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="80" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <!-- More stars -->
    <circle cx="80" cy="180" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="200" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="190" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="210" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="190" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="210" r="1.5"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <!-- Purple-tinted stars -->
    <circle cx="420" cy="100" r="2" fill="#c4b5fd"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="160" r="1.5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="150" r="2" fill="#c4b5fd"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="120" r="1.5" fill="#a78bfa"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Horizontal glow line -->
  <rect x="180" y="108" width="500" height="1" fill="#a78bfa" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="500;520;500" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="180;170;180" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- MAIN TEXT -->
  <!-- Shadow/glow layer -->
  <text x="430" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800"
        fill="#a78bfa" text-anchor="middle" filter="url(#textGlow)" opacity="0.6">
    Hey, I'm Billy Joe! 👋
  </text>
  <!-- Main text -->
  <text x="430" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800"
        fill="#ffffff" text-anchor="middle">
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    Hey, I'm Billy Joe! 👋
  </text>

  <!-- Subtitle -->
  <text x="430" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400"
        fill="#c4b5fd" text-anchor="middle">
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
    🚀 Front-End Web Developer  ·  Philippines 🇵🇭
  </text>

  <!-- Sub-subtitle -->
  <text x="430" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="300"
        fill="#8b7cf8" text-anchor="middle">
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    Building Beautiful &amp; Responsive Websites ✨
  </text>

  <!-- Decorative dots -->
  <circle cx="320" cy="165" r="3" fill="#7c3aed" opacity="0.8">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="165" r="3" fill="#7c3aed" opacity="0.8">
    <animate attributeName="r" values="3;5;3" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom wave decoration -->
  <path d="M0 200 Q215 185 430 200 Q645 215 860 200 L860 220 L0 220 Z" fill="#7c3aed" opacity="0.15">
    <animate attributeName="d"
      values="M0 200 Q215 185 430 200 Q645 215 860 200 L860 220 L0 220 Z;
              M0 205 Q215 195 430 205 Q645 215 860 205 L860 220 L0 220 Z;
              M0 200 Q215 185 430 200 Q645 215 860 200 L860 220 L0 220 Z"
      dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
